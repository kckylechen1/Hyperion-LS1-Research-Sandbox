[project]
name = "hyperion-ls1-research-sandbox"
version = "0.1.0"
description = "Public-safe LS1 output contract, Alpha Tensor projection, and Decision Provenance research sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyperion_ls1_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]